<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CypherEdge Compatibility Check</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        margin: 0;
        padding: 0;
        border: none;
        outline: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          "Oxygen", "Ubuntu", "Cantarell", sans-serif;
        background: white;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        box-sizing: border-box;
      }
      
      html {
        margin: 0;
        padding: 0;
        border: none;
        outline: none;
        box-sizing: border-box;
      }
      
      * {
        box-sizing: border-box;
      }
      #compatibility-root {
        width: 100vw;
        height: 100vh;
      }
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-size: 18px;
        color: #64748b;
        flex-direction: column;
      }
      .loading-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #e2e8f0;
        border-top: 3px solid #0056b3;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Tailwind-like utility classes for compatibility */
      .min-h-screen { min-height: 100vh; }
      .bg-gradient-to-br { background-image: linear-gradient(to bottom right, var(--tw-gradient-stops)); }
      .from-gray-50 { --tw-gradient-from: #f9fafb; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to, rgb(249 250 251 / 0)); }
      .to-gray-100 { --tw-gradient-to: #f3f4f6; }
      
      /* CypherEdge brand colors */
      :root {
        --cypheridge-blue: #0056b3;
        --cypheridge-blue-light: #3b82f6;
        --cypheridge-gray: #64748b;
        --cypheridge-success: #22c55e;
        --cypheridge-warning: #f59e0b;
        --cypheridge-error: #ef4444;
      }
    </style>
  </head>
  <body>
    <div id="compatibility-root">
      <div class="loading">
        <div class="loading-spinner"></div>
        <div>Loading compatibility checker...</div>
      </div>
    </div>

    <script>
      // Bridge for Electron IPC
      const { ipcRenderer } = require("electron");

      // Global API for React components to communicate with main process
      window.electronAPI = {
        onTestProgress: (callback) => ipcRenderer.on("test-progress", callback),
        onCompatibilityComplete: (callback) =>
          ipcRenderer.on("compatibility-complete", callback),
        sendUserDecision: (decision) =>
          ipcRenderer.invoke("compatibility:user-decision", decision),
        startTests: () => ipcRenderer.invoke("compatibility:start-tests"),
        removeAllListeners: () => {
          ipcRenderer.removeAllListeners("test-progress");
          ipcRenderer.removeAllListeners("compatibility-complete");
        },
      };

      // Simple React-like component system for Phase 1
      // This will be replaced with proper React build in later phases
      class CompatibilityApp {
        constructor() {
          this.currentStep = 1;
          this.testResults = null;
          this.testProgress = {};
          this.isTestingComplete = false;
          this.setupEventListeners();
        }

        setupEventListeners() {
          // Listen for test progress updates from main process
          window.electronAPI.onTestProgress((event, progress) => {
            console.log("Test progress received:", progress);
            this.testProgress[`${progress.suiteName}-${progress.testName}`] = progress;
            if (this.currentStep === 2) {
              this.updateTestingUI(progress);
            }
          });

          // Listen for compatibility check completion
          window.electronAPI.onCompatibilityComplete((event, results) => {
            console.log("Compatibility check completed:", results);
            this.testResults = results;
            this.isTestingComplete = true;
            this.showStep3();
          });
        }

        init() {
          this.render();
        }

        render() {
          const root = document.getElementById("compatibility-root");
          root.innerHTML = this.getCurrentStepHTML();
          this.attachEventListeners();
        }

        getCurrentStepHTML() {
          switch (this.currentStep) {
            case 1:
              return this.getStep1HTML();
            case 2:
              return this.getStep2HTML();
            case 3:
              return this.getStep3HTML();
            default:
              return this.getStep1HTML();
          }
        }

        getStep1HTML() {
          return `
            <div style="background: white; height: 100vh; width: 100vw; position: relative; overflow-y: auto;">
              
              <!-- Frameless Window Controls -->
              <div style="position: absolute; top: 15px; right: 15px; z-index: 1000; display: flex; gap: 8px;">
                <button onclick="window.compatApp.minimizeWindow()" style="
                  background: rgba(156, 163, 175, 0.8);
                  color: white;
                  border: none;
                  width: 30px;
                  height: 30px;
                  border-radius: 50%;
                  cursor: pointer;
                  font-size: 16px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-weight: bold;
                " onmouseover="this.style.background='rgba(156, 163, 175, 1)'" onmouseout="this.style.background='rgba(156, 163, 175, 0.8)'">−</button>
                <button onclick="window.compatApp.closeWindow()" style="
                  background: rgba(239, 68, 68, 0.8);
                  color: white;
                  border: none;
                  width: 30px;
                  height: 30px;
                  border-radius: 50%;
                  cursor: pointer;
                  font-size: 16px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                " onmouseover="this.style.background='rgba(239, 68, 68, 1)'" onmouseout="this.style.background='rgba(239, 68, 68, 0.8)'">×</button>
              </div>
              
              <div style="padding: 60px 40px 40px 40px; max-width: 700px; margin: 0 auto; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
                <div style="width: 100%;">
                  
                  <!-- Progress Header -->
                  <div style="text-align: center; margin-bottom: 40px;">
                    <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 20px;">
                      <div style="display: flex; align-items: center; gap: 8px;">
                        <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--cypheridge-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600;">1</div>
                        <div style="width: 40px; height: 2px; background: #e2e8f0;"></div>
                        <div style="width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0; color: #94a3b8; display: flex; align-items: center; justify-content: center; font-weight: 600;">2</div>
                        <div style="width: 40px; height: 2px; background: #e2e8f0;"></div>
                        <div style="width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0; color: #94a3b8; display: flex; align-items: center; justify-content: center; font-weight: 600;">3</div>
                      </div>
                    </div>
                    <div style="color: #64748b; font-size: 14px;">Step 1 of 3</div>
                  </div>

                  <!-- Main Content -->
                  <div style="text-align: center;">
                    <div style="font-size: 48px; margin-bottom: 20px;">🔍</div>
                    <h1 style="font-size: 28px; font-weight: 700; color: #1e293b; margin-bottom: 12px;">System Compatibility Check</h1>
                    <p style="color: #64748b; font-size: 16px; line-height: 1.6; margin-bottom: 32px;">
                      We'll quickly verify your system compatibility to ensure CypherEdge runs smoothly.
                    </p>

                    <!-- Checklist -->
                    <div style="text-align: left; background: #f8fafc; border-radius: 8px; padding: 24px; margin-bottom: 32px;">
                      <div style="font-weight: 600; color: #374151; margin-bottom: 16px;">This process will check:</div>
                      <div style="display: flex; flex-direction: column; gap: 8px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                          <span style="color: var(--cypheridge-success);">✓</span>
                          <span style="color: #4b5563;">Port availability (7500, 7890)</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                          <span style="color: var(--cypheridge-success);">✓</span>
                          <span style="color: #4b5563;">System requirements (RAM, disk, Windows)</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                          <span style="color: var(--cypheridge-success);">✓</span>
                          <span style="color: #4b5563;">Service permissions</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                          <span style="color: var(--cypheridge-success);">✓</span>
                          <span style="color: #4b5563;">Component accessibility</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                          <span style="color: var(--cypheridge-success);">✓</span>
                          <span style="color: #4b5563;">PDF processing capabilities</span>
                        </div>
                      </div>
                    </div>

                    <!-- Time estimate -->
                    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 24px; color: #64748b; font-size: 14px;">
                      <span>⏱️</span>
                      <span>This typically takes 10-30 seconds</span>
                    </div>

                    <!-- Continue Button - Made more prominent -->
                    <button id="continue-btn" style="
                      background: var(--cypheridge-blue);
                      color: white;
                      border: none;
                      padding: 14px 40px;
                      border-radius: 8px;
                      font-size: 18px;
                      font-weight: 600;
                      cursor: pointer;
                      transition: all 0.2s;
                      box-shadow: 0 4px 6px rgba(0, 86, 179, 0.2);
                      transform: translateY(0);
                    " onmouseover="this.style.background='#004494'; this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 12px rgba(0, 86, 179, 0.3)'" onmouseout="this.style.background='var(--cypheridge-blue)'; this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 6px rgba(0, 86, 179, 0.2)'">
                      Continue →
                    </button>
                    
                    <!-- Auto-start countdown -->
                    <div id="auto-start-countdown" style="margin-top: 16px; font-size: 12px; color: #94a3b8; text-align: center;">
                      Auto-starting in <span id="countdown">2</span> seconds...
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        getStep2HTML() {
          return `
            <div style="background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); height: 100vh; width: 100vw; position: relative; overflow-y: auto;">
              
              <!-- Frameless Window Controls -->
              <div style="position: absolute; top: 15px; right: 15px; z-index: 1000; display: flex; gap: 8px;">
                <button onclick="window.compatApp.minimizeWindow()" style="
                  background: rgba(156, 163, 175, 0.8);
                  color: white;
                  border: none;
                  width: 32px;
                  height: 32px;
                  border-radius: 6px;
                  cursor: pointer;
                  font-size: 16px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-weight: bold;
                  backdrop-filter: blur(10px);
                  transition: all 0.2s;
                " onmouseover="this.style.background='rgba(156, 163, 175, 1)'; this.style.transform='scale(1.05)'" onmouseout="this.style.background='rgba(156, 163, 175, 0.8)'; this.style.transform='scale(1)'">−</button>
                <button onclick="window.compatApp.closeWindow()" style="
                  background: rgba(239, 68, 68, 0.8);
                  color: white;
                  border: none;
                  width: 32px;
                  height: 32px;
                  border-radius: 6px;
                  cursor: pointer;
                  font-size: 16px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  backdrop-filter: blur(10px);
                  transition: all 0.2s;
                " onmouseover="this.style.background='rgba(239, 68, 68, 1)'; this.style.transform='scale(1.05)'" onmouseout="this.style.background='rgba(239, 68, 68, 0.8)'; this.style.transform='scale(1)'">×</button>
              </div>
              
              <div style="padding: 60px 40px 40px 40px; max-width: 900px; margin: 0 auto;">
                  
                  <!-- Progress Header -->
                  <div style="text-align: center; margin-bottom: 40px;">
                    <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 20px;">
                      <div style="display: flex; align-items: center; gap: 12px;">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--cypheridge-success); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);">✓</div>
                        <div style="width: 50px; height: 3px; background: linear-gradient(90deg, var(--cypheridge-success), var(--cypheridge-blue)); border-radius: 2px;"></div>
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--cypheridge-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; box-shadow: 0 4px 12px rgba(0, 86, 179, 0.3); animation: pulse 2s infinite;">
                          <div style="position: absolute; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--cypheridge-blue); animation: ripple 2s infinite;"></div>
                          2
                        </div>
                        <div style="width: 50px; height: 3px; background: #e2e8f0; border-radius: 2px;"></div>
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: #e2e8f0; color: #94a3b8; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px;">3</div>
                      </div>
                    </div>
                    <div style="color: #64748b; font-size: 14px; font-weight: 500;">Step 2 of 3 • Running System Validation</div>
                  </div>

                  <!-- Main Status Card -->
                  <div style="background: white; border-radius: 16px; padding: 32px; margin-bottom: 32px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);">
                    <div style="text-align: center; margin-bottom: 24px;">
                      <div style="font-size: 54px; margin-bottom: 16px; animation: rotate 2s linear infinite;">🔍</div>
                      <h1 style="font-size: 32px; font-weight: 700; color: #1e293b; margin-bottom: 8px;">Running Compatibility Tests</h1>
                      <div id="progress-counter" style="color: #64748b; font-size: 18px; font-weight: 500;">Initializing... (0/15)</div>
                      
                      <!-- Progress Bar -->
                      <div style="width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; margin: 20px 0; overflow: hidden;">
                        <div id="progress-bar" style="height: 100%; background: linear-gradient(90deg, var(--cypheridge-blue), var(--cypheridge-blue-light)); border-radius: 3px; width: 0%; transition: width 0.5s ease; box-shadow: 0 0 10px rgba(0, 86, 179, 0.3);"></div>
                      </div>
                      
                      <!-- Current Test Status -->
                      <div id="current-test-status" style="font-size: 14px; color: #475569; font-weight: 500; min-height: 20px; margin-bottom: 8px;">Preparing system validation...</div>
                      <div id="current-test-details" style="font-size: 12px; color: #64748b; min-height: 16px; font-style: italic;"></div>
                    </div>
                  </div>

                  <!-- Test Suites -->
                  <div id="test-suites" style="display: flex; flex-direction: column; gap: 20px;">
                    ${this.getEnhancedTestSuitesHTML()}
                  </div>
                  
                  <!-- Performance Info -->
                  <div style="margin-top: 24px; text-align: center;">
                    <div style="background: rgba(255, 255, 255, 0.7); border-radius: 12px; padding: 16px; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3);">
                      <div style="display: flex; justify-content: center; gap: 32px; font-size: 13px;">
                        <div style="display: flex; align-items: center; gap: 6px; color: #64748b;">
                          <span>⏱️</span>
                          <span id="elapsed-time">0s elapsed</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 6px; color: #64748b;">
                          <span>🔧</span>
                          <span>Real system validation</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 6px; color: #64748b;">
                          <span>🚀</span>
                          <span id="estimated-remaining">~30s remaining</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            
            <style>
              @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.7; }
              }
              
              @keyframes ripple {
                0% {
                  transform: scale(1);
                  opacity: 0.6;
                }
                100% {
                  transform: scale(1.4);
                  opacity: 0;
                }
              }
              
              @keyframes rotate {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
              }
              
              @keyframes slideIn {
                from {
                  opacity: 0;
                  transform: translateY(20px);
                }
                to {
                  opacity: 1;
                  transform: translateY(0);
                }
              }
              
              .test-suite-card {
                animation: slideIn 0.5s ease-out forwards;
              }
            </style>
          `;
        }

        getTestSuitesHTML() {
          const suites = [
            {
              name: "System Requirements",
              tests: ["Available RAM", "ML Models Memory", "Disk Space", "Windows Version", "Admin Privileges"]
            },
            {
              name: "Component Auto-Startup & Verification",
              tests: ["CypherEdge Component Flow Test"]
            },
            {
              name: "Basic Port Availability",
              tests: ["Python Backend Port (7500)", "Gateway Service Port (7890)", "FastAPI Health Check"]
            },
            {
              name: "File System Tests", 
              tests: ["Python Executable", "Gateway Service", "Database Access", "File Permissions"]
            },
            {
              name: "API Dependencies",
              tests: ["FastAPI Dependencies", "PDF Processing Capability"]
            }
          ];

          return suites.map(suite => `
            <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; background: white;">
              <div style="font-weight: 600; color: #374151; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                <span id="suite-status-${suite.name.replace(/\\s+/g, '-')}" style="font-size: 16px;">⏳</span>
                ${suite.name}
              </div>
              <div style="display: flex; flex-direction: column; gap: 8px; margin-left: 24px;">
                ${suite.tests.map(test => `
                  <div id="test-${suite.name.replace(/\\s+/g, '-')}-${test.replace(/[^a-zA-Z0-9]/g, '-')}" style="padding: 8px 0;">
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                      <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="test-status" style="font-size: 14px;">⏳</span>
                        <span style="color: #4b5563; font-size: 14px;">${test}</span>
                      </div>
                      <span class="test-result" style="font-size: 12px; color: #64748b;"></span>
                    </div>
                    <div class="test-details" style="font-size: 11px; color: #6b7280; margin-top: 4px; margin-left: 22px; display: none; font-style: italic;"></div>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('');
        }

        getStep3HTML() {
          const results = this.testResults;
          const totalTests = results.successes.length + results.warnings.length + results.issues.length;
          const isCompatible = results.canProceed !== false;
          const statusText = results.canProceed === true ? "COMPATIBLE" : results.canProceed === false ? "INCOMPATIBLE" : "COMPATIBLE WITH WARNINGS";
          const statusColor = results.canProceed === true ? "var(--cypheridge-success)" : results.canProceed === false ? "var(--cypheridge-error)" : "var(--cypheridge-warning)";

          return `
            <div style="background: white; height: 100vh; width: 100vw; position: relative; overflow-y: auto;">
              
              <!-- Frameless Window Controls -->
              <div style="position: absolute; top: 15px; right: 15px; z-index: 1000; display: flex; gap: 8px;">
                <button onclick="window.compatApp.minimizeWindow()" style="
                  background: rgba(156, 163, 175, 0.8);
                  color: white;
                  border: none;
                  width: 30px;
                  height: 30px;
                  border-radius: 50%;
                  cursor: pointer;
                  font-size: 16px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-weight: bold;
                " onmouseover="this.style.background='rgba(156, 163, 175, 1)'" onmouseout="this.style.background='rgba(156, 163, 175, 0.8)'">−</button>
                <button onclick="window.compatApp.closeWindow()" style="
                  background: rgba(239, 68, 68, 0.8);
                  color: white;
                  border: none;
                  width: 30px;
                  height: 30px;
                  border-radius: 50%;
                  cursor: pointer;
                  font-size: 16px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                " onmouseover="this.style.background='rgba(239, 68, 68, 1)'" onmouseout="this.style.background='rgba(239, 68, 68, 0.8)'">×</button>
              </div>
              
              <div style="padding: 60px 40px 40px 40px; max-width: 800px; margin: 0 auto;">
                  
                  <!-- Progress Header -->
                  <div style="text-align: center; margin-bottom: 40px;">
                    <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 20px;">
                      <div style="display: flex; align-items: center; gap: 8px;">
                        <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--cypheridge-success); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600;">✓</div>
                        <div style="width: 40px; height: 2px; background: var(--cypheridge-success);"></div>
                        <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--cypheridge-success); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600;">✓</div>
                        <div style="width: 40px; height: 2px; background: var(--cypheridge-success);"></div>
                        <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--cypheridge-success); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600;">3</div>
                      </div>
                    </div>
                    <div style="color: #64748b; font-size: 14px;">Step 3 of 3</div>
                  </div>

                  <!-- Main Content -->
                  <div style="text-align: center;">
                    <div style="font-size: 48px; margin-bottom: 20px;">${isCompatible ? '✅' : '❌'}</div>
                    <h1 style="font-size: 28px; font-weight: 700; color: #1e293b; margin-bottom: 32px;">System Compatibility Check Complete</h1>

                    <!-- Status Card -->
                    <div style="background: ${results.canProceed === true ? '#f0fdf4' : results.canProceed === false ? '#fef2f2' : '#fffbeb'}; border: 1px solid ${results.canProceed === true ? '#bbf7d0' : results.canProceed === false ? '#fecaca' : '#fed7aa'}; border-radius: 8px; padding: 24px; margin-bottom: 32px;">
                      <div style="font-size: 18px; font-weight: 700; color: ${statusColor}; margin-bottom: 16px;">
                        SYSTEM STATUS: ${statusText}
                      </div>
                      <div style="display: flex; justify-content: space-around; text-align: center;">
                        <div>
                          <div style="font-size: 24px; font-weight: 700; color: var(--cypheridge-success);">${results.successes.length}</div>
                          <div style="font-size: 12px; color: #64748b;">Tests Passed</div>
                        </div>
                        <div>
                          <div style="font-size: 24px; font-weight: 700; color: var(--cypheridge-warning);">${results.warnings.length}</div>
                          <div style="font-size: 12px; color: #64748b;">Warnings</div>
                        </div>
                        <div>
                          <div style="font-size: 24px; font-weight: 700; color: var(--cypheridge-error);">${results.issues.length}</div>
                          <div style="font-size: 12px; color: #64748b;">Critical Issues</div>
                        </div>
                      </div>
                      <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #e2e8f0;">
                        <div style="font-size: 14px; color: #64748b;">
                          Estimated Startup Time: ${Math.round(results.duration / 1000) + 8} seconds
                        </div>
                        <div style="font-size: 14px; color: #64748b;">
                          Configuration: ${results.warnings.length > 0 ? 'Fallback Mode' : 'Standard Mode'}
                        </div>
                      </div>
                    </div>

                    <!-- Warnings (if any) -->
                    ${results.warnings.length > 0 ? `
                      <div style="background: #fffbeb; border: 1px solid #fed7aa; border-radius: 8px; padding: 16px; margin-bottom: 24px; text-align: left;">
                        ${results.warnings.map(warning => `
                          <div style="display: flex; align-items: start; gap: 8px; margin-bottom: 8px;">
                            <span style="color: var(--cypheridge-warning); margin-top: 2px;">⚠️</span>
                            <div>
                              <div style="font-weight: 600; color: #92400e; font-size: 14px;">${warning.test}</div>
                              <div style="color: #a16207; font-size: 13px;">${warning.message}</div>
                            </div>
                          </div>
                        `).join('')}
                      </div>
                    ` : ''}

                    <!-- Report Info -->
                    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 32px; color: #64748b; font-size: 14px;">
                      <span>📊</span>
                      <span>Detailed report will be saved to compatibility-reports</span>
                    </div>

                    <!-- Action Buttons -->
                    <div style="display: flex; gap: 12px; justify-content: center;">
                      <button id="view-report-btn" style="
                        background: #f8fafc;
                        color: #475569;
                        border: 1px solid #e2e8f0;
                        padding: 12px 24px;
                        border-radius: 8px;
                        font-size: 14px;
                        font-weight: 600;
                        cursor: pointer;
                        transition: all 0.2s;
                      " onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='#f8fafc'">
                        View Report
                      </button>
                      <button id="launch-btn" style="
                        background: var(--cypheridge-blue);
                        color: white;
                        border: none;
                        padding: 12px 24px;
                        border-radius: 8px;
                        font-size: 14px;
                        font-weight: 600;
                        cursor: pointer;
                        transition: background 0.2s;
                      " onmouseover="this.style.background='#004494'" onmouseout="this.style.background='var(--cypheridge-blue)'">
                        ${results.canProceed === false ? 'Exit Application' : 'Launch CypherEdge'} →
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        attachEventListeners() {
          const continueBtn = document.getElementById("continue-btn");
          if (continueBtn) {
            continueBtn.addEventListener("click", () => {
              this.startTests();
            });
          }

          const launchBtn = document.getElementById("launch-btn");
          if (launchBtn) {
            launchBtn.addEventListener("click", () => {
              this.handleUserDecision("proceed");
            });
          }

          const viewReportBtn = document.getElementById("view-report-btn");
          if (viewReportBtn) {
            viewReportBtn.addEventListener("click", () => {
              this.handleUserDecision("view-report");
            });
          }
        }

        async startTests() {
          console.log("Starting compatibility tests...");
          this.currentStep = 2;
          this.testProgress = {};
          this.isTestingComplete = false;
          this.render();

          try {
            await window.electronAPI.startTests();
          } catch (error) {
            console.error("Failed to start compatibility tests:", error);
          }
        }

        updateTestingUI(progress) {
          console.log('🔄 updateTestingUI called with:', progress); // Debug logging
          
          const testId = `test-${progress.suiteName.replace(/\\s+/g, '-')}-${progress.testName.replace(/[^a-zA-Z0-9]/g, '-')}`;
          const testElement = document.getElementById(testId);
          
          // Update overall progress
          this.updateOverallProgress(progress);
          
          if (testElement) {
            const statusElement = testElement.querySelector('.test-status');
            const resultElement = testElement.querySelector('.test-result');
            const detailsElement = testElement.querySelector('.test-details');
            
            switch (progress.status) {
              case 'testing':
                statusElement.textContent = '🔄';
                resultElement.textContent = 'TESTING';
                resultElement.style.color = '#64748b';
                
                // Enhanced live update display with priority handling
                if (detailsElement) {
                  let detailMessage = '';
                  
                  // Priority 1: Show componentAction from IsolatedCompatibilityBubble
                  if (progress.details?.componentAction) {
                    detailMessage = progress.details.componentAction;
                    console.log('📱 Showing componentAction:', detailMessage);
                  }
                  // Priority 2: Show enhanced description for current test
                  else if (progress.details?.description) {
                    detailMessage = progress.details.description;
                    console.log('📱 Showing description:', detailMessage);
                  }
                  // Priority 3: Show general message
                  else if (progress.message) {
                    detailMessage = progress.message;
                    console.log('📱 Showing message:', detailMessage);
                  }
                  
                  if (detailMessage) {
                    detailsElement.textContent = detailMessage;
                    detailsElement.style.display = 'block';
                    detailsElement.style.color = '#64748b';
                    detailsElement.style.fontSize = '11px';
                    detailsElement.style.marginTop = '4px';
                    detailsElement.style.marginLeft = '22px';
                    detailsElement.style.fontStyle = 'italic';
                  }
                }
                break;
              case 'success':
                statusElement.textContent = '✅';
                resultElement.textContent = 'PASSED';
                resultElement.style.color = 'var(--cypheridge-success)';
                
                // Hide details when test completes successfully
                if (detailsElement) {
                  detailsElement.style.display = 'none';
                }
                break;
              case 'warning':
                statusElement.textContent = '⚠️';
                resultElement.textContent = 'WARNING';
                resultElement.style.color = 'var(--cypheridge-warning)';
                
                // Show warning details
                if (detailsElement && progress.message) {
                  detailsElement.textContent = progress.message;
                  detailsElement.style.display = 'block';
                  detailsElement.style.color = 'var(--cypheridge-warning)';
                }
                break;
              case 'error':
                statusElement.textContent = '❌';
                resultElement.textContent = 'FAILED';
                resultElement.style.color = 'var(--cypheridge-error)';
                
                // Show error details
                if (detailsElement && progress.message) {
                  detailsElement.textContent = progress.message;
                  detailsElement.style.display = 'block';
                  detailsElement.style.color = 'var(--cypheridge-error)';
                }
                break;
            }
          } else {
            console.warn('⚠️ Test element not found:', testId);
          }

          // Update progress counter
          const completed = Object.keys(this.testProgress).length;
          const progressCounter = document.getElementById('progress-counter');
          if (progressCounter) {
            progressCounter.textContent = `(${completed}/16)`;
          }
        }

        showStep3() {
          this.currentStep = 3;
          this.render();
        }

        async handleUserDecision(decision) {
          console.log("User decision:", decision);
          await window.electronAPI.sendUserDecision(decision);
        }

        updateOverallProgress(progress) {
          // Update progress counter
          const completed = Object.keys(this.testProgress).length;
          const progressCounter = document.getElementById('progress-counter');
          if (progressCounter) {
            progressCounter.textContent = `Testing in progress... (${completed}/15)`;
          }
          
          // Update progress bar if we have percentage info
          if (progress.progress?.percentage !== undefined) {
            const progressBar = document.getElementById('progress-bar');
            if (progressBar) {
              progressBar.style.width = `${progress.progress.percentage}%`;
            }
          }
          
          // Update current test status
          const currentTestStatus = document.getElementById('current-test-status');
          if (currentTestStatus) {
            currentTestStatus.textContent = `Testing ${progress.testName}...`;
          }
          
          const currentTestDetails = document.getElementById('current-test-details');
          if (currentTestDetails && progress.details?.description) {
            currentTestDetails.textContent = progress.details.description;
          }
        }

        getEnhancedTestSuitesHTML() {
          // Enhanced version with better styling
          const suites = [
            {
              name: "System Requirements",
              icon: "🖥️",
              tests: ["Available RAM", "ML Models Memory", "Disk Space", "Windows Version", "Admin Privileges"]
            },
            {
              name: "Component Auto-Startup & Verification",
              icon: "🚀", 
              tests: ["CypherEdge Component Flow Test"]
            },
            {
              name: "Basic Port Availability",
              icon: "🌐",
              tests: ["Python Backend Port (7500)", "Gateway Service Port (7890)", "FastAPI Health Check"]
            },
            {
              name: "File System Tests",
              icon: "📁", 
              tests: ["Python Executable", "Gateway Service", "Database Access", "File Permissions"]
            },
            {
              name: "API Dependencies",
              icon: "🔧",
              tests: ["FastAPI Dependencies", "PDF Processing Capability"]
            }
          ];

          return suites.map((suite, index) => `
            <div class="test-suite-card" style="background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); border: 1px solid rgba(0, 0, 0, 0.05); animation-delay: ${index * 0.1}s;">
              <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
                <span style="font-size: 20px;">${suite.icon}</span>
                <div style="flex: 1;">
                  <div style="font-weight: 600; color: #1e293b; font-size: 16px;">${suite.name}</div>
                  <div style="font-size: 12px; color: #64748b; margin-top: 2px;">${suite.tests.length} tests</div>
                </div>
                <span id="suite-status-${suite.name.replace(/\\s+/g, '-')}" style="font-size: 18px;">⏳</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 10px;">
                ${suite.tests.map(test => `
                  <div id="test-${suite.name.replace(/\\s+/g, '-')}-${test.replace(/[^a-zA-Z0-9]/g, '-')}" style="border-radius: 8px; padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0;">
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                      <div style="display: flex; align-items: center; gap: 10px;">
                        <span class="test-status" style="font-size: 16px;">⏳</span>
                        <div>
                          <div style="color: #374151; font-size: 14px; font-weight: 500;">${test}</div>
                        </div>
                      </div>
                      <span class="test-result" style="font-size: 12px; color: #64748b; font-weight: 600;"></span>
                    </div>
                    <div class="test-details" style="font-size: 11px; color: #6b7280; margin-top: 8px; margin-left: 26px; display: none; font-style: italic; line-height: 1.4;"></div>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('');
        }

        // Window control functions for frameless window
        minimizeWindow() {
          const { remote } = require('electron');
          if (remote && remote.getCurrentWindow) {
            remote.getCurrentWindow().minimize();
          } else {
            // Fallback for newer Electron versions
            window.electronAPI.sendUserDecision('minimize');
          }
        }

        closeWindow() {
          const { remote } = require('electron');
          if (remote && remote.getCurrentWindow) {
            remote.getCurrentWindow().close();
          } else {
            // Fallback - send cancel decision
            this.handleUserDecision('cancel');
          }
        }
      }

      // Initialize the app when DOM is ready
      document.addEventListener("DOMContentLoaded", () => {
        const app = new CompatibilityApp();
        window.compatApp = app; // Make app globally accessible for window controls
        app.init();
        
        // Start countdown timer for auto-start (reduced for testing)
        let countdown = 2; // Reduced from 5 to 2 for faster testing
        const countdownInterval = setInterval(() => {
          countdown--;
          const countdownElement = document.getElementById('countdown');
          if (countdownElement) {
            countdownElement.textContent = countdown;
          }
          
          if (countdown <= 0) {
            clearInterval(countdownInterval);
            const countdownContainer = document.getElementById('auto-start-countdown');
            if (countdownContainer) {
              countdownContainer.textContent = 'Auto-starting now...';
            }
            // Auto-start the tests
            const app = window.compatApp;
            if (app) {
              app.startTests();
            }
          }
        }, 1000);
        
        // Clear countdown if user clicks Continue
        const continueBtn = document.getElementById('continue-btn');
        if (continueBtn) {
          continueBtn.addEventListener('click', () => {
            clearInterval(countdownInterval);
          });
        }
      });
    </script>
  </body>
</html>
