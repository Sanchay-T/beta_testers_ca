<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CypherEdge Compatibility Check</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        margin: 0;
        padding: 0;
        border: none;
        outline: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          "Oxygen", "Ubuntu", "Cantarell", sans-serif;
        background: white;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        box-sizing: border-box;
      }
      
      html {
        margin: 0;
        padding: 0;
        border: none;
        outline: none;
        box-sizing: border-box;
      }
      
      * {
        box-sizing: border-box;
      }
      #compatibility-root {
        width: 100vw;
        height: 100vh;
      }
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-size: 18px;
        color: #64748b;
        flex-direction: column;
      }
      .loading-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #e2e8f0;
        border-top: 3px solid #0056b3;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Professional Modal Animations */
      @keyframes overlayFadeIn {
        0% { 
          opacity: 0; 
          backdrop-filter: blur(0px); 
        }
        100% { 
          opacity: 1; 
          backdrop-filter: blur(12px); 
        }
      }

      /* Responsive Design for Professional Modals */
      @media (max-width: 768px) {
        .hybrid-modal-content {
          margin: 10px !important;
          padding: 24px !important;
          max-width: calc(100vw - 20px) !important;
          width: calc(100vw - 20px) !important;
        }
        
        .hybrid-choice-grid {
          grid-template-columns: 1fr !important;
          gap: 12px !important;
        }
        
        .hybrid-modal-buttons {
          flex-direction: column !important;
          gap: 12px !important;
        }
        
        .hybrid-modal-buttons button {
          width: 100% !important;
        }
      }

      @media (max-height: 700px) {
        .hybrid-modal-overlay {
          align-items: flex-start !important;
          padding-top: 20px !important;
        }
      }

      @keyframes modalSlideIn {
        0% { 
          opacity: 0; 
          transform: translateY(20px) scale(0.95); 
          filter: blur(1px);
        }
        100% { 
          opacity: 1; 
          transform: translateY(0) scale(1); 
          filter: blur(0px);
        }
      }

      @keyframes fadeOut {
        0% { 
          opacity: 1; 
          transform: scale(1); 
        }
        100% { 
          opacity: 0; 
          transform: scale(0.95); 
        }
      }

      @keyframes fadeIn {
        0% { 
          opacity: 0; 
        }
        100% { 
          opacity: 1; 
        }
      }
      
      /* Tailwind-like utility classes for compatibility */
      .min-h-screen { min-height: 100vh; }
      .bg-gradient-to-br { background-image: linear-gradient(to bottom right, var(--tw-gradient-stops)); }
      .from-gray-50 { --tw-gradient-from: #f9fafb; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to, rgb(249 250 251 / 0)); }
      .to-gray-100 { --tw-gradient-to: #f3f4f6; }
      
      /* CypherEdge brand colors */
      :root {
        --cypheridge-blue: #0056b3;
        --cypheridge-blue-light: #3b82f6;
        --cypheridge-gray: #64748b;
        --cypheridge-success: #22c55e;
        --cypheridge-warning: #f59e0b;
        --cypheridge-error: #ef4444;
      }
    </style>
  </head>
  <body>
    <div id="compatibility-root">
      <div class="loading">
        <div class="loading-spinner"></div>
        <div>Loading compatibility checker...</div>
      </div>
    </div>

    <script>
      // 🎯 SINGLE SOURCE OF TRUTH FOR MODE DETECTION
      // This variable is set once and used by BOTH UI and EMAIL systems
      window.GLOBAL_DETECTED_MODE = 'SCAN'; // Default, will be updated by mode detection
      
      // 🧪 MANUAL VALIDATION FUNCTION - Force HYBRID mode for testing
      window.FORCE_VALIDATION_MODE = function(testMode = 'HYBRID') {
        console.log('🧪 ======================== MANUAL VALIDATION MODE ========================');
        console.log('🧪 FORCING MODE DETECTION TO:', testMode);
        console.log('🧪 This will override ALL systems to test data consistency');
        console.log('🧪 ======================================================================');
        
        // Override the global source of truth
        window.GLOBAL_DETECTED_MODE = testMode;
        try {
          // Persist immediately so backend/APIs can read the same value
          ipcRenderer?.invoke('app-mode:store-global-mode', window.GLOBAL_DETECTED_MODE);
        } catch (e) { /* no-op */ }
        console.log('🧪 [STEP 1] GLOBAL_DETECTED_MODE set to:', window.GLOBAL_DETECTED_MODE);
        
        // Force update UI immediately if elements exist
        const configMode = document.getElementById('configuration-mode');
        if (configMode) {
          const modeLabels = {
            'SCAN': 'Standard Mode',
            'UNSCAN': 'UNSCAN Mode', 
            'HYBRID': 'HYBRID Mode',
            'ERROR': 'Fallback Mode'
          };
          configMode.textContent = modeLabels[testMode] || 'Unknown Mode';
          console.log('🧪 [STEP 2] UI configuration-mode updated to:', configMode.textContent);
        }
        
        return {
          forcedMode: testMode,
          globalVariable: window.GLOBAL_DETECTED_MODE,
          timestamp: new Date().toISOString()
        };
      };
      
      // Bridge for Electron IPC
      const { ipcRenderer } = require("electron");

      // UI Flow Logger for Compatibility Page
      window.CypherEdgeLogger = {
        logPageEvent: function(eventType, data) {
          console.log('🔍 [COMPATIBILITY_UI]', eventType, data);
          
          // Send to main process for centralized logging
          if (ipcRenderer) {
            ipcRenderer.invoke('ui-logger:log-event', {
              page: 'compatibility.html',
              eventType: eventType,
              data: data,
              timestamp: new Date().toISOString(),
              url: window.location.href
            });
          }
        },
        
        logButtonClick: function(buttonId, buttonText, action, context) {
          this.logPageEvent('BUTTON_CLICK', {
            buttonId: buttonId,
            buttonText: buttonText,
            action: action,
            context: context || {}
          });
        },
        
        logFlowStep: function(step, mode, data) {
          this.logPageEvent('FLOW_STEP', {
            step: step,
            mode: mode,
            data: data || {}
          });
        },
        
        logModalAction: function(modalName, action, data) {
          this.logPageEvent('MODAL_ACTION', {
            modalName: modalName,
            action: action,
            data: data || {}
          });
        },

        logPageNavigation: function(page, trigger) {
          this.logPageEvent('PAGE_NAVIGATION', {
            page: page,
            trigger: trigger || 'unknown'
          });
        }
      };

      // Global API for React components to communicate with main process
      window.electronAPI = {
        onTestProgress: (callback) => ipcRenderer.on("test-progress", callback),
        onCompatibilityComplete: (callback) =>
          ipcRenderer.on("compatibility-complete", callback),
        sendUserDecision: (decision) =>
          ipcRenderer.invoke("compatibility:user-decision", decision),
        submitEmail: (data) => ipcRenderer.invoke("email:submit", data),
        startTests: () => ipcRenderer.invoke("compatibility:start-tests"),
        invoke: (channel, ...args) => ipcRenderer.invoke(channel, ...args),
        onModeNotification: (callback) => {
          ipcRenderer.on("mode-notification:show-unscan", callback);
          ipcRenderer.on("hybrid-flow:show-screen", callback);
        },
        removeAllListeners: () => {
          ipcRenderer.removeAllListeners("test-progress");
          ipcRenderer.removeAllListeners("compatibility-complete");
          ipcRenderer.removeAllListeners("mode-notification:show-unscan");
          ipcRenderer.removeAllListeners("hybrid-flow:show-screen");
        },
      };

      // Simple React-like component system for Phase 1
      // This will be replaced with proper React build in later phases
      class CompatibilityApp {
        constructor() {
          this.currentStep = 0;
          this.userEmail = null;
          this.testResults = null;
          this.testProgress = {};
          this.isTestingComplete = false;
          this.modeNotificationActive = false;
          this.setupEventListeners();
          this.setupAutoButtonLogging();
        }

        // Auto-logging setup for all button clicks
        setupAutoButtonLogging() {
          // Log page load
          window.CypherEdgeLogger.logPageNavigation('CompatibilityChecker', 'page-load');
          
          // Auto-log all button clicks throughout the page
          document.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.type === 'button' || e.target.onclick) {
              const buttonId = e.target.id || 'unnamed-button';
              const buttonText = e.target.textContent || e.target.value || 'No Text';
              const buttonAction = e.target.onclick ? e.target.onclick.name : 'click';
              
              window.CypherEdgeLogger.logButtonClick(buttonId, buttonText, buttonAction, {
                className: e.target.className,
                currentStep: this.currentStep,
                modeNotificationActive: this.modeNotificationActive,
                isTestingComplete: this.isTestingComplete,
                tagName: e.target.tagName,
                type: e.target.type
              });
            }
          });

          // Auto-log form submissions
          document.addEventListener('submit', (e) => {
            window.CypherEdgeLogger.logPageEvent('FORM_SUBMIT', {
              formId: e.target.id || 'unnamed-form',
              action: e.target.action,
              method: e.target.method,
              currentStep: this.currentStep
            });
          });

          // Auto-log input focus events for form fields
          document.addEventListener('focus', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
              window.CypherEdgeLogger.logPageEvent('INPUT_FOCUS', {
                inputId: e.target.id || 'unnamed-input',
                inputType: e.target.type || 'text',
                inputName: e.target.name || 'unnamed',
                currentStep: this.currentStep
              });
            }
          }, true);
        }

        setupEventListeners() {
          // Listen for test progress updates from main process
          window.electronAPI.onTestProgress((event, progress) => {
            console.log("Test progress received:", progress);
            this.testProgress[`${progress.suiteName}-${progress.testName}`] = progress;
            if (this.currentStep === 2) {
              this.updateTestingUI(progress);
            }
          });

          // Listen for compatibility check completion
          window.electronAPI.onCompatibilityComplete((event, results) => {
            console.log("Compatibility check completed:", results);
            this.testResults = results;
            this.isTestingComplete = true;
            this.showStep3();
          });

          // Listen for mode notifications
          window.electronAPI.onModeNotification((event, notificationData) => {
            console.log("Mode notification received:", notificationData);
            this.showModeNotification(notificationData);
          });
        }

        init() {
          this.render();
        }

        render() {
          const root = document.getElementById("compatibility-root");
          root.innerHTML = this.getCurrentStepHTML();
          this.attachEventListeners();
        }

        getCurrentStepHTML() {
          switch (this.currentStep) {
            case 0:
              return this.getStep0HTML();
            case 1:
              return this.getStep1HTML();
            case 2:
              return this.getStep2HTML();
            case 3:
              return this.getStep3HTML();
            default:
              return this.getStep0HTML();
          }
        }

        getStep0HTML() {
          return `
            <div style="background: white; height: 100vh; width: 100vw; position: relative; overflow-y: auto;">
              <div style="padding: 60px 40px 40px 40px; max-width: 500px; margin: 0 auto; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
                <div style="width: 100%; text-align: center;">
                  
                  <!-- CypherEdge Logo -->
                  <div style="margin-bottom: 40px;">
                    <div style="width: 80px; height: 80px; background: linear-gradient(135deg, var(--cypheridge-blue) 0%, var(--cypheridge-blue-light) 100%); border-radius: 16px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; color: white; font-size: 36px; font-weight: bold;">C</div>
                    <h1 style="font-size: 28px; font-weight: 700; color: #1f2937; margin: 0 0 8px 0;">Welcome to CypherEdge</h1>
                    <p style="color: var(--cypheridge-gray); font-size: 16px; margin: 0;">Please enter your email address to begin</p>
                  </div>

                  <!-- Email Form -->
                  <form id="emailForm" style="margin-bottom: 30px;">
                    <div style="text-align: left; margin-bottom: 20px;">
                      <label for="emailInput" style="display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 8px;">Email Address</label>
                      <input 
                        type="email" 
                        id="emailInput" 
                        name="email" 
                        style="width: 100%; padding: 12px 16px; border: 2px solid #e1e5e9; border-radius: 8px; font-size: 16px; transition: border-color 0.2s, box-shadow 0.2s; background: #ffffff;"
                        placeholder="Enter your email address"
                        required
                      />
                    </div>

                    <button 
                      type="submit" 
                      id="continueBtn"
                      style="width: 100%; background: linear-gradient(135deg, var(--cypheridge-blue) 0%, var(--cypheridge-blue-light) 100%); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.2s;"
                    >
                      Continue to Compatibility Check
                    </button>
                  </form>

                  <!-- Status Message -->
                  <div id="emailStatus" style="margin-top: 15px; padding: 10px 12px; border-radius: 6px; font-size: 14px; display: none;"></div>

                </div>
              </div>
            </div>
          `;
        }

        getStep1HTML() {
          return `
            <div style="background: white; height: 100vh; width: 100vw; position: relative; overflow-y: auto;">
              
              <!-- Native window controls will be handled by the OS frame -->
              
              <div style="padding: 60px 40px 40px 40px; max-width: 700px; margin: 0 auto; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
                <div style="width: 100%;">
                  
                  <!-- Progress Header -->
                  <div style="text-align: center; margin-bottom: 40px;">
                    <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 20px;">
                      <div style="display: flex; align-items: center; gap: 8px;">
                        <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--cypheridge-success); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600;">✓</div>
                        <div style="width: 40px; height: 2px; background: var(--cypheridge-success);"></div>
                        <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--cypheridge-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600;">1</div>
                        <div style="width: 40px; height: 2px; background: #e2e8f0;"></div>
                        <div style="width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0; color: #94a3b8; display: flex; align-items: center; justify-content: center; font-weight: 600;">2</div>
                        <div style="width: 40px; height: 2px; background: #e2e8f0;"></div>
                        <div style="width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0; color: #94a3b8; display: flex; align-items: center; justify-content: center; font-weight: 600;">3</div>
                      </div>
                    </div>
                    <div style="color: #64748b; font-size: 14px;">System Check</div>
                  </div>

                  <!-- Main Content -->
                  <div style="text-align: center;">
                    <div style="font-size: 48px; margin-bottom: 20px;">🔍</div>
                    <h1 style="font-size: 28px; font-weight: 700; color: #1e293b; margin-bottom: 12px;">System Compatibility Check</h1>
                    <p style="color: #64748b; font-size: 16px; line-height: 1.6; margin-bottom: 32px;">
                      We'll quickly verify your system compatibility to ensure CypherEdge runs smoothly.
                    </p>

                    <!-- Checklist -->
                    <div style="text-align: left; background: #f8fafc; border-radius: 8px; padding: 24px; margin-bottom: 32px;">
                      <div style="font-weight: 600; color: #374151; margin-bottom: 16px;">This process will check:</div>
                      <div style="display: flex; flex-direction: column; gap: 8px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                          <span style="color: var(--cypheridge-success);">✓</span>
                          <span style="color: #4b5563;">Port availability (7500, 7890)</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                          <span style="color: var(--cypheridge-success);">✓</span>
                          <span style="color: #4b5563;">System requirements (RAM, disk, Windows)</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                          <span style="color: var(--cypheridge-success);">✓</span>
                          <span style="color: #4b5563;">Service permissions</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                          <span style="color: var(--cypheridge-success);">✓</span>
                          <span style="color: #4b5563;">Component accessibility</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                          <span style="color: var(--cypheridge-success);">✓</span>
                          <span style="color: #4b5563;">PDF processing capabilities</span>
                        </div>
                      </div>
                    </div>

                    <!-- Time estimate -->
                    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 24px; color: #64748b; font-size: 14px;">
                      <span>⏱️</span>
                      <span>This typically takes 10-30 seconds</span>
                    </div>

                    <!-- Continue Button - Made more prominent -->
                    <button id="continue-btn" style="
                      background: var(--cypheridge-blue);
                      color: white;
                      border: none;
                      padding: 14px 40px;
                      border-radius: 8px;
                      font-size: 18px;
                      font-weight: 600;
                      cursor: pointer;
                      transition: all 0.2s;
                      box-shadow: 0 4px 6px rgba(0, 86, 179, 0.2);
                      transform: translateY(0);
                    " onmouseover="this.style.background='#004494'; this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 12px rgba(0, 86, 179, 0.3)'" onmouseout="this.style.background='var(--cypheridge-blue)'; this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 6px rgba(0, 86, 179, 0.2)'">
                      Continue →
                    </button>
                    
                    <!-- Auto-start countdown -->
                    <div id="auto-start-countdown" style="margin-top: 16px; font-size: 12px; color: #94a3b8; text-align: center;">
                      Auto-starting in <span id="countdown">2</span> seconds...
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        getStep2HTML() {
          return `
            <div style="background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); height: 100vh; width: 100vw; position: relative; overflow-y: auto;">
              
              <!-- Native window controls will be handled by the OS frame -->
              
              <div style="padding: 60px 40px 40px 40px; max-width: 900px; margin: 0 auto;">
                  
                  <!-- Progress Header -->
                  <div style="text-align: center; margin-bottom: 40px;">
                    <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 20px;">
                      <div style="display: flex; align-items: center; gap: 12px;">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--cypheridge-success); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);">✓</div>
                        <div style="width: 50px; height: 3px; background: var(--cypheridge-success); border-radius: 2px;"></div>
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--cypheridge-success); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);">✓</div>
                        <div style="width: 50px; height: 3px; background: linear-gradient(90deg, var(--cypheridge-success), var(--cypheridge-blue)); border-radius: 2px;"></div>
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--cypheridge-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; box-shadow: 0 4px 12px rgba(0, 86, 179, 0.3); animation: pulse 2s infinite;">
                          <div style="position: absolute; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--cypheridge-blue); animation: ripple 2s infinite;"></div>
                          2
                        </div>
                        <div style="width: 50px; height: 3px; background: #e2e8f0; border-radius: 2px;"></div>
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: #e2e8f0; color: #94a3b8; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px;">3</div>
                      </div>
                    </div>
                    <div style="color: #64748b; font-size: 14px; font-weight: 500;">Preparing Application</div>
                  </div>

                  <!-- Main Status Card -->
                  <div style="background: white; border-radius: 16px; padding: 32px; margin-bottom: 32px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);">
                    <div style="text-align: center; margin-bottom: 24px;">
                      <div style="font-size: 54px; margin-bottom: 16px; animation: rotate 2s linear infinite;">🔍</div>
                      <h1 style="font-size: 32px; font-weight: 700; color: #1e293b; margin-bottom: 8px;">Running Compatibility Tests</h1>
                      <div id="progress-counter" style="color: #64748b; font-size: 18px; font-weight: 500;">Initializing... (0/15)</div>
                      
                      <!-- Progress Bar -->
                      <div style="width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; margin: 20px 0; overflow: hidden;">
                        <div id="progress-bar" style="height: 100%; background: linear-gradient(90deg, var(--cypheridge-blue), var(--cypheridge-blue-light)); border-radius: 3px; width: 0%; transition: width 0.5s ease; box-shadow: 0 0 10px rgba(0, 86, 179, 0.3);"></div>
                      </div>
                      
                      <!-- Current Test Status -->
                      <div id="current-test-status" style="font-size: 14px; color: #475569; font-weight: 500; min-height: 20px; margin-bottom: 8px;">Preparing system validation...</div>
                      <div id="current-test-details" style="font-size: 12px; color: #64748b; min-height: 16px; font-style: italic;"></div>
                    </div>
                  </div>

                  <!-- Test Suites -->
                  <div id="test-suites" style="display: flex; flex-direction: column; gap: 20px;">
                    ${this.getEnhancedTestSuitesHTML()}
                  </div>
                  
                  <!-- Performance Info -->
                  <div style="margin-top: 24px; text-align: center;">
                    <div style="background: rgba(255, 255, 255, 0.7); border-radius: 12px; padding: 16px; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3);">
                      <div style="display: flex; justify-content: center; gap: 32px; font-size: 13px;">
                        <div style="display: flex; align-items: center; gap: 6px; color: #64748b;">
                          <span>⏱️</span>
                          <span id="elapsed-time">0s elapsed</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 6px; color: #64748b;">
                          <span>🔧</span>
                          <span>Real system validation</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 6px; color: #64748b;">
                          <span>🚀</span>
                          <span id="estimated-remaining">~30s remaining</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            
            <style>
              @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.7; }
              }
              
              @keyframes ripple {
                0% {
                  transform: scale(1);
                  opacity: 0.6;
                }
                100% {
                  transform: scale(1.4);
                  opacity: 0;
                }

        attachEventListeners() {
          // Step 0: Email form handling
          const emailForm = document.getElementById("emailForm");
          if (emailForm) {
            emailForm.addEventListener("submit", async (e) => {
              e.preventDefault();
              await this.handleEmailSubmission();
            });
          }

          // Email input focus styling
          const emailInput = document.getElementById("emailInput");
          if (emailInput) {
            emailInput.addEventListener("focus", () => {
              emailInput.style.borderColor = "var(--cypheridge-blue)";
              emailInput.style.boxShadow = "0 0 0 3px rgba(0, 86, 179, 0.1)";
            });
            emailInput.addEventListener("blur", () => {
              emailInput.style.borderColor = "#e1e5e9";
              emailInput.style.boxShadow = "none";
            });
          }

          const continueBtn = document.getElementById("continue-btn");
          if (continueBtn) {
            continueBtn.addEventListener("click", () => {
              this.startTests();
            });
          }

          const launchBtn = document.getElementById("launch-btn");
          if (launchBtn) {
            launchBtn.addEventListener("click", () => {
              this.handleUserDecision("proceed");
            });
          }

          const viewReportBtn = document.getElementById("view-report-btn");
          if (viewReportBtn) {
            viewReportBtn.addEventListener("click", () => {
              this.handleUserDecision("view-report");
            });
          }
        }

        async handleEmailSubmission() {
          const emailInput = document.getElementById("emailInput");
          const continueBtn = document.getElementById("continueBtn");
          const statusDiv = document.getElementById("emailStatus");
          
          const email = emailInput.value.trim();
          
          if (!email) {
            this.showEmailStatus("Please enter an email address", "error");
            return;
          }

          // Basic email validation
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(email)) {
            this.showEmailStatus("Please enter a valid email address", "error");
            return;
          }

          // Show loading state
          continueBtn.disabled = true;
          continueBtn.style.opacity = "0.7";
          continueBtn.innerHTML = "Validating...";

          try {
            console.log("📧 Validating email with Cyphersol API:", email);
            
            // Call Cyphersol check-user API
            const response = await fetch(`https://cyphersol.co.in/api/check-user/?email=${encodeURIComponent(email)}`);
            
            if (!response.ok) {
              throw new Error(`API request failed with status: ${response.status}`);
            }
            
            const result = await response.json();
            console.log("📧 Cyphersol API response:", result);
            
            if (result.status === "success" && result.user_exists === true) {
              // User exists in Cyphersol system - proceed with compatibility check
              this.userEmail = email;
              this.showEmailStatus("Email validated successfully! Starting compatibility check...", "success");
              
              // Submit email via IPC for local processing
              try {
                await window.electronAPI.submitEmail({ email });
              } catch (ipcError) {
                console.warn("IPC email submission failed:", ipcError);
                // Continue anyway since Cyphersol validation passed
              }
              
              // Proceed to Step 1 after short delay
              setTimeout(() => {
                this.currentStep = 1;
                this.render();
                
                // Start auto-countdown for Step 1 (only after email is validated)
                this.startAutoCountdown();
              }, 1000);
              
            } else if (result.status === "success" && result.user_exists === false) {
              // User does not exist in Cyphersol system - deny access
              this.showEmailStatus("Email not found in Cyphersol system. Please contact support or register first.", "error");
              console.log("🚫 Access denied: User does not exist in Cyphersol system");
              
            } else {
              // Unexpected response format
              throw new Error("Unexpected API response format");
            }
            
          } catch (error) {
            console.error("Email validation error:", error);
            
            // Provide specific error messages based on error type
            if (error.message.includes("fetch")) {
              this.showEmailStatus("Network error. Please check your internet connection and try again.", "error");
            } else if (error.message.includes("API request failed")) {
              this.showEmailStatus("Validation service temporarily unavailable. Please try again later.", "error");
            } else {
              this.showEmailStatus("Email validation failed. Please try again or contact support.", "error");
            }
          } finally {
            // Reset button state
            continueBtn.disabled = false;
            continueBtn.style.opacity = "1";
            continueBtn.innerHTML = "Continue to Compatibility Check";
          }
        }

        showEmailStatus(message, type) {
          const statusDiv = document.getElementById("emailStatus");
          if (statusDiv) {
            statusDiv.textContent = message;
            statusDiv.style.display = "block";
            
            if (type === "success") {
              statusDiv.style.background = "#d4edda";
              statusDiv.style.color = "#155724";
              statusDiv.style.border = "1px solid #c3e6cb";
            } else if (type === "error") {
              statusDiv.style.background = "#f8d7da";
              statusDiv.style.color = "#721c24";
              statusDiv.style.border = "1px solid #f5c6cb";
            }
          }
        }

        startAutoCountdown() {
          // Only start countdown if we're on Step 1 and countdown element exists
          setTimeout(() => {
            const countdownElement = document.getElementById('countdown');
            if (!countdownElement || this.currentStep !== 1) return;
            
            let countdown = 5; // 5 second auto-start for Step 1
            const countdownInterval = setInterval(() => {
              countdown--;
              const countdownElement = document.getElementById('countdown');
              if (countdownElement) {
                countdownElement.textContent = countdown;
              }
              
              if (countdown <= 0) {
                clearInterval(countdownInterval);
                const countdownContainer = document.getElementById('auto-start-countdown');
                if (countdownContainer) {
                  countdownContainer.textContent = 'Auto-starting now...';
                }
                // Auto-start the tests
                this.startTests();
              }
            }, 1000);
            
            // Clear countdown if user clicks Continue manually
            const continueBtn = document.getElementById('continue-btn');
            if (continueBtn) {
              continueBtn.addEventListener('click', () => {
                clearInterval(countdownInterval);
              });
            }
          }, 100); // Small delay to ensure DOM is rendered
        }

        async startTests() {
          console.log("Starting compatibility tests...");
          this.currentStep = 2;
          this.testProgress = {};
          this.isTestingComplete = false;
          this.render();

          try {
            // Only run compatibility tests - mode detection will run in showStep3()
            await window.electronAPI.startTests();
          } catch (error) {
            console.error("Failed to start compatibility tests:", error);
          }
        }

        updateTestingUI(progress) {
          console.log('🔄 updateTestingUI called with:', progress); // Debug logging
          
          const testId = `test-${progress.suiteName.replace(/\\s+/g, '-')}-${progress.testName.replace(/[^a-zA-Z0-9]/g, '-')}`;
          const testElement = document.getElementById(testId);
          
          // Update overall progress
          this.updateOverallProgress(progress);
          
          if (testElement) {
            const statusElement = testElement.querySelector('.test-status');
            const resultElement = testElement.querySelector('.test-result');
            const detailsElement = testElement.querySelector('.test-details');
            
            switch (progress.status) {
              case 'testing':
                statusElement.textContent = '🔄';
                resultElement.textContent = 'TESTING';
                resultElement.style.color = '#64748b';
                
                // Enhanced live update display with priority handling
                if (detailsElement) {
                  let detailMessage = '';
                  
                  // Priority 1: Show componentAction from IsolatedCompatibilityBubble
                  if (progress.details?.componentAction) {
                    detailMessage = progress.details.componentAction;
                    console.log('📱 Showing componentAction:', detailMessage);
                  }
                  // Priority 2: Show enhanced description for current test
                  else if (progress.details?.description) {
                    detailMessage = progress.details.description;
                    console.log('📱 Showing description:', detailMessage);
                  }
                  // Priority 3: Show general message
                  else if (progress.message) {
                    detailMessage = progress.message;
                    console.log('📱 Showing message:', detailMessage);
                  }
                  
                  if (detailMessage) {
                    detailsElement.textContent = detailMessage;
                    detailsElement.style.display = 'block';
                    detailsElement.style.color = '#64748b';
                    detailsElement.style.fontSize = '11px';
                    detailsElement.style.marginTop = '4px';
                    detailsElement.style.marginLeft = '22px';
                    detailsElement.style.fontStyle = 'italic';
                  }
                }
                break;
              case 'success':
                statusElement.textContent = '✅';

                    <span style="font-size: 14px; color: #2d3748; font-weight: 600;">2-4 hours</span>
                  </div>
                </div>
              </div>

              <!-- Support Contact -->
              <div style="
                background: #fffbeb; border: 1px solid #f59e0b; border-radius: 12px; 
                padding: 16px; margin-bottom: 24px; text-align: center;
              ">
                <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 8px;">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: #f59e0b; margin-right: 8px;">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                  </svg>
                  <span style="font-size: 15px; color: #92400e; font-weight: 600;">Need immediate assistance?</span>
                </div>
                <p style="margin: 0 0 8px 0; font-size: 13px; color: #92400e;">
                  Our team will contact you shortly. For urgent queries, reach us at:
                </p>
                <p style="margin: 0; font-size: 14px; color: #92400e; font-weight: 600;">
                  support@cypheredge.com | +91-12345-67890
                </p>
              </div>

              <!-- Important Notice -->
              <div style="
                background: #fef3c7; border: 2px solid #f59e0b; border-radius: 12px; 
                padding: 20px; margin-bottom: 24px; text-align: center;
              ">
                <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: #d97706; margin-right: 8px;">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 8v4"/>
                    <path d="M12 16h.01"/>
                  </svg>
                  <span style="font-size: 18px; color: #92400e; font-weight: 700;">Important Notice</span>
                </div>
                <p style="margin: 0; font-size: 15px; color: #92400e; line-height: 1.5; font-weight: 600;">
                  Your system requires HYBRID Mode for optimal performance. CypherEdge cannot run in Standard Mode on this device. 
                  Please wait for our team to activate HYBRID Mode or try using a higher-specification computer.
                </p>
              </div>

              <!-- Action Buttons -->
              <div style="text-align: center;">
                <button id="close-application" style="
                  background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); color: white; border: none; 
                  padding: 16px 32px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
                  transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px;
                  box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
                " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 8px 20px rgba(220, 38, 38, 0.3)'" 
                   onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(220, 38, 38, 0.2)'">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M18 6L6 18"/>
                    <path d="M6 6l12 12"/>
                  </svg>
                  Close Application
                </button>
                <p style="margin: 16px 0 0 0; font-size: 13px; color: #6b7280;">
                  Our team will contact you within 2-4 hours to activate HYBRID Mode
                </p>
              </div>

              <!-- CSS Animations -->
              <style>
                @keyframes pulse {
                  0%, 100% { opacity: 1; }
                  50% { opacity: 0.5; }
                }
              </style>
            `;
            
            // Handle close application button (only option for HYBRID users)
            document.getElementById('close-application').addEventListener('click', () => {
              console.log('✅ [PAYMENT COMPLETE] HYBRID user must close - Standard Mode not available');
              document.body.style.overflow = ''; // Restore body scroll
              modalOverlay.style.animation = 'fadeOut 0.3s ease-out forwards';
              setTimeout(() => {
                if (modalOverlay.parentNode) modalOverlay.remove();
                this.handleUserDecision('cancel'); // Close the app - HYBRID users cannot use Standard Mode
              }, 300);
            });
            
          }, 300);
        }
        
        launchHybridMode(modalOverlay) {
          console.log('🚀 [HYBRID LAUNCH] Launching CypherEdge in HYBRID Mode...');
          
          modalOverlay.style.animation = 'fadeOut 0.4s ease-out forwards';
          
          setTimeout(() => {
            if (modalOverlay.parentNode) {
              modalOverlay.remove();
            }
            console.log('🚀 [HYBRID LAUNCH] Modal removed, executing HYBRID launch');
            this.handleUserDecision('proceed'); // Launch the app
          }, 400);
        }
        
        addModalAnimations() {
          // Add CSS animations if not already present
          if (!document.getElementById('modal-animations')) {
            const style = document.createElement('style');
            style.id = 'modal-animations';
            style.textContent = `
              @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
              }
              @keyframes fadeOut {
                from { opacity: 1; }
                to { opacity: 0; }
              }
              @keyframes modalSlideIn {
                from { 
                  opacity: 0; 
                  transform: scale(0.8) translateY(-20px); 
                }
                to { 
                  opacity: 1; 
                  transform: scale(1) translateY(0); 
                }
              }
              @keyframes slideIn {
                from { 
                  opacity: 0; 
                  transform: translateX(20px); 
                }
                to { 
                  opacity: 1; 
                  transform: translateX(0); 
                }
              }
            `;
            document.head.appendChild(style);
          }
        }
        
        // Send email audit report when final results page is displayed
        async sendEmailAuditReport() {
          console.log('📧 🎯 === SENDING EMAIL AUDIT REPORT ===');
          
          try {
            // Use IPC to trigger email audit in the backend SystemCompatibilityChecker
            console.log('📧 🎯 Calling compatibility:send-email-audit via IPC...');
            
            const result = await window.electronAPI.compatibilityCheck.sendEmailAudit({
              testResults: this.testResults,
              currentStep: this.currentStep,
              timestamp: new Date().toISOString()
            });
            
            if (result.success) {
              console.log('📧 ✅ Email audit sent successfully!');
              console.log('📧 ✅ Email ID:', result.emailId);
              console.log('📧 ✅ Recipients:', result.recipients);
            } else {
              console.log('📧 ❌ Email audit failed:', result.error);
            }
            
          } catch (error) {
            console.error('📧 💥 Email audit exception:', error);
          }
          
          console.log('📧 🎯 === EMAIL AUDIT REPORT COMPLETED ===');
        }
      }

      // Initialize the app when DOM is ready
      document.addEventListener("DOMContentLoaded", () => {
        const app = new CompatibilityApp();
        window.compatApp = app; // Make app globally accessible for window controls
        app.init();
        
        // Only start countdown if we're on Step 1 (not Step 0 email input)
        // This will be started manually when user reaches Step 1
      });
    </script>
  </body>
