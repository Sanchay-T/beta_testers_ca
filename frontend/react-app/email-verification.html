<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CypherEdge - Email Verification</title>
  <style>
    :root {
      --cypheridge-blue: #0056b3;
      --cypheridge-success: #22c55e;
      --cypheridge-error: #dc2626;
      --cypheridge-warning: #f59e0b;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .verification-container {
      background: white;
      border-radius: 16px;
      padding: 48px;
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.15);
      max-width: 450px;
      width: 90%;
      text-align: center;
      animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    @keyframes slideIn {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    .logo-section {
      margin-bottom: 32px;
    }
    
    .logo-text {
      font-size: 28px;
      font-weight: 700;
      color: var(--cypheridge-blue);
      margin-bottom: 8px;
    }
    
    .subtitle {
      color: #64748b;
      font-size: 16px;
    }
    
    .verification-form {
      margin-bottom: 24px;
    }
    
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #1e293b;
      font-size: 14px;
    }
    
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.2s;
      background: #f8fafc;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--cypheridge-blue);
      background: white;
      box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.1);
    }
    
    .verify-btn {
      width: 100%;
      padding: 14px 24px;
      background: var(--cypheridge-blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 16px;
    }
    
    .verify-btn:hover {
      background: #004494;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 86, 179, 0.3);
    }
    
    .verify-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    .status-message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-weight: 500;
      display: none;
    }
    
    .status-success {
      background: #f0fdf4;
      color: var(--cypheridge-success);
      border: 1px solid #bbf7d0;
    }
    
    .status-error {
      background: #fef2f2;
      color: var(--cypheridge-error);
      border: 1px solid #fecaca;
    }
    
    .status-loading {
      background: #fffbeb;
      color: var(--cypheridge-warning);
      border: 1px solid #fed7aa;
    }
    
    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #f3f4f6;
      border-radius: 50%;
      border-top-color: var(--cypheridge-blue);
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .demo-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #e2e8f0;
    }
    
    .demo-title {
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 12px;
    }
    
    .demo-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .demo-btn {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      background: white;
      color: #64748b;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .demo-btn:hover {
      border-color: var(--cypheridge-blue);
      color: var(--cypheridge-blue);
    }
    
    .footer-text {
      margin-top: 24px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="verification-container">
    <div class="logo-section">
      <div class="logo-text">CypherEdge</div>
      <div class="subtitle">Email Verification Required</div>
    </div>
    
    <div class="verification-form">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          class="form-input" 
          placeholder="Enter your email address"
          required
        >
      </div>
      
      <div id="status-message" class="status-message"></div>
      
      <button id="verify-btn" class="verify-btn">
        Verify & Continue
      </button>
    </div>
    
    <div class="demo-section">
      <div class="demo-title">Demo & Testing</div>
      <div class="demo-buttons">
        <button class="demo-btn" onclick="testEmail('valid@test.com', true)">
          ✅ Valid Email
        </button>
        <button class="demo-btn" onclick="testEmail('invalid@test.com', false)">
          ❌ Invalid Email
        </button>
        <button class="demo-btn" onclick="testEmail('admin@cyphersol.co.in', true)">
          👑 Admin Email
        </button>
      </div>
    </div>
    
    <div class="footer-text">
      Secure email verification powered by CypherEdge
    </div>
  </div>

  <script>
    // Set up Electron API for email verification
    const { ipcRenderer } = require('electron');
    window.electronAPI = {
      storeVerifiedEmail: (email) => ipcRenderer.invoke('email-verification:store', email),
      startCompatibilityCheck: () => ipcRenderer.invoke('email-verification:start-compatibility')
    };

    class EmailVerification {
      constructor() {
        this.emailInput = document.getElementById('email');
        this.verifyBtn = document.getElementById('verify-btn');
        this.statusMessage = document.getElementById('status-message');
        
        this.setupEventListeners();
        
        console.log('🔐 Email verification screen initialized');
      }
      
      setupEventListeners() {
        this.verifyBtn.addEventListener('click', () => this.handleVerification());
        
        this.emailInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            this.handleVerification();
          }
        });
        
        this.emailInput.addEventListener('input', () => {
          this.clearStatus();
        });
      }
      
      async handleVerification() {
        const email = this.emailInput.value.trim();
        
        if (!email) {
          this.showStatus('Please enter an email address', 'error');
          return;
        }
        
        if (!this.isValidEmail(email)) {
          this.showStatus('Please enter a valid email address', 'error');
          return;
        }
        
        console.log('🔐 [EMAIL_VERIFICATION] Starting verification for:', email);
        
        this.showStatus('Verifying email with server...', 'loading');
        this.setButtonLoading(true);
        
        try {
          const isValid = await this.verifyEmailWithBackend(email);
          
          if (isValid) {
            this.showStatus('✅ Email verified successfully!', 'success');
            
            console.log('🔐 [EMAIL_VERIFICATION] ✅ Email verified - proceeding to compatibility check');
            
            // Wait 1.5 seconds to show success, then proceed
            setTimeout(() => {
              this.proceedToCompatibilityCheck(email);
            }, 1500);
          } else {
            this.showStatus('❌ Email not authorized. Please contact support.', 'error');
            this.setButtonLoading(false);
            
            console.log('🔐 [EMAIL_VERIFICATION] ❌ Email verification failed');
          }
        } catch (error) {
          console.error('🔐 [EMAIL_VERIFICATION] Error during verification:', error);
          this.showStatus('❌ Verification failed. Please check your connection and try again.', 'error');
          this.setButtonLoading(false);
        }
      }
      
      async verifyEmailWithBackend(email) {
        // 🔧 DEMO/TESTING - Replace with real API call
        console.log('🔐 [API_CALL] Verifying email with backend:', email);
        
        // Simulate API delay
        await new Promise(resolve => setTimeout(resolve, 2000));
        
        // Demo logic - Replace with real backend call
        const validEmails = [
          'valid@test.com',
          'admin@cyphersol.co.in',
          'test@cypheredge.com',
          'demo@example.com'
        ];
        
        const isValid = validEmails.includes(email.toLowerCase());
        
        console.log('🔐 [API_RESPONSE] Email validation result:', isValid);
        
        /* 
        // 🚀 PRODUCTION - Replace above demo logic with this:
        try {
          const response = await fetch('https://api.cyphersol.co.in/verify-email', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email: email })
          });
          
          const result = await response.json();
          return result.valid === true;
        } catch (error) {
          console.error('Backend verification failed:', error);
          return false;
        }
        */
        
        return isValid;
      }
      
      isValidEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
      }
      
      showStatus(message, type) {
        this.statusMessage.textContent = message;
        this.statusMessage.className = `status-message status-${type}`;
        this.statusMessage.style.display = 'block';
        
        if (type === 'loading') {
          this.statusMessage.innerHTML = `
            <span class="loading-spinner"></span>
            ${message}
          `;
        }
      }
      
      clearStatus() {
        this.statusMessage.style.display = 'none';
      }
      
      setButtonLoading(loading) {
        if (loading) {
          this.verifyBtn.disabled = true;
          this.verifyBtn.innerHTML = `
            <span class="loading-spinner"></span>
            Verifying...
          `;
        } else {
          this.verifyBtn.disabled = false;
          this.verifyBtn.innerHTML = 'Verify & Continue';
        }
      }
      
      async proceedToCompatibilityCheck(email) {
        console.log('🔐 [EMAIL_VERIFICATION] ✅ Proceeding to compatibility check with verified email:', email);
        
        // Store verified email for later use
        try {
          await window.electronAPI.storeVerifiedEmail(email);
          console.log('🔐 [EMAIL_VERIFICATION] Email stored for compatibility reporting');
        } catch (error) {
          console.error('🔐 [EMAIL_VERIFICATION] Failed to store email:', error);
        }
        
        // Redirect to compatibility check
        try {
          await window.electronAPI.startCompatibilityCheck();
          console.log('🔐 [EMAIL_VERIFICATION] Compatibility check initiated');
        } catch (error) {
          console.error('🔐 [EMAIL_VERIFICATION] Failed to start compatibility check:', error);
          this.showStatus('❌ Failed to proceed. Please restart the application.', 'error');
        }
      }
    }
    
    // 🧪 Demo/Testing Functions
    function testEmail(email, expectedResult) {
      const emailInput = document.getElementById('email');
      emailInput.value = email;
      
      console.log(`🧪 [DEMO] Testing email: ${email} (expected: ${expectedResult ? '✅' : '❌'})`);
    }
    
    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
      new EmailVerification();
    });
  </script>
</body>
</html>
