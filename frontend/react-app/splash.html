<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Cyphersol | Initializing...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #0f172a, #0e1e32, #0a172b);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
            padding: 20px;
        }

        .logo-container {
            width: 205px;
            height: 115px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.2);
            animation: float 3s ease-in-out infinite;
        }

        .logo {
            width: 215px;
            height: 215px;
            object-fit: contain;
            transform: translateX(-10px)
                /* No filters applied to keep the logo plain */
        }

        .tagline h1 {
            font-size: 2.2rem;
            font-weight: bold;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: -0.015em;
        }

        .tagline p {
            color: #cbd5e1;
            font-size: 1.1rem;
            text-align: center;
            opacity: 0.9;
            margin-bottom: 25px;
        }

        .loading-container {
            position: relative;
            width: 180px;
            height: 32px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
        }

        .loading-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 30%;
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.6), rgba(139, 92, 246, 0.8));
            border-radius: 16px;
            animation: loading 2s infinite;
        }

        .loading-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
            color: white;
            letter-spacing: 0.5px;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes loading {
            0% {
                width: 0%;
                left: 0;
            }

            50% {
                width: 30%;
                left: 70%;
            }

            100% {
                width: 0%;
                left: 0;
            }
        }
    </style>
</head>

<body>
    <div class="logo-container">
        <img src="./src/data/assets/logo.png" alt="Cyphersol" class="logo" />
    </div>

    <div class="tagline">
        <h1>Be intelligently lazy</h1>
        <p>Work smarter, not harder</p>
    </div>

    <div class="loading-container">
        <div class="loading-bar"></div>
        <div class="loading-text">Initializing...</div>
    </div>
</body>

</html>
