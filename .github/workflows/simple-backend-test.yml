name: Simple Backend Build & Test
on:
  push:
    branches: [test/backend-automation]
    paths:
      - 'backend/**'
      - 'postbuild.py'
      - '.github/workflows/simple-backend-test.yml'
  workflow_dispatch:  # Allow manual triggering

env:
  PYTHON_VERSION: '3.11'
  NODE_ENV: 'development'
  VALIDATE_LICENSE: 'false'
  FOR_ATS: 'false'
  APP_VERSION: 'dev-${{ github.run_number }}'

jobs:
  build-and-test-backend:
    name: Build and Test Backend
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Clone Repository
        uses: actions/checkout@v4

      - name: ✅ Verify Code Checkout
        run: |
          Write-Host "✅ Code cloned to Windows runner" -ForegroundColor Green
          Write-Host "📁 Current directory: $(Get-Location)" -ForegroundColor Cyan
          Write-Host "📋 Repository contents:" -ForegroundColor Yellow
          Get-ChildItem -Name | Select-Object -First 10
        shell: pwsh

      - name: 🔐 Create Environment Configuration
        run: |
          Write-Host "🔧 Creating environment configuration..." -ForegroundColor Yellow
          
          $envContent = @"
          DB_FILE_NAME=${{ secrets.DB_FILE_NAME }}
          NODE_ENV=${{ env.NODE_ENV }}
          UUID_SALT=${{ secrets.UUID_SALT }}
          VALIDATE_LICENSE=${{ env.VALIDATE_LICENSE }}
          API_URL=${{ secrets.API_URL }}
          FOR_ATS=${{ env.FOR_ATS }}
          GH_TOKEN=${{ secrets.GH_TOKEN }}
          APP_VERSION=${{ env.APP_VERSION }}
          "@
          
          if (-not (Test-Path "frontend")) {
            New-Item -ItemType Directory -Path "frontend" -Force
          }
          
          $envContent | Out-File -FilePath "frontend/.env" -Encoding UTF8
          
          Write-Host "✅ Environment file created" -ForegroundColor Green
          Write-Host "📄 Environment variables set:" -ForegroundColor Cyan
          Write-Host "  - NODE_ENV: ${{ env.NODE_ENV }}" -ForegroundColor White
          Write-Host "  - APP_VERSION: ${{ env.APP_VERSION }}" -ForegroundColor White
          Write-Host "  - VALIDATE_LICENSE: ${{ env.VALIDATE_LICENSE }}" -ForegroundColor White
        shell: pwsh

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ✅ Verify Python Installation
        run: |
          Write-Host "🔍 Checking Python installation..." -ForegroundColor Yellow
          python --version
          Write-Host "📍 Python location: $(where python)" -ForegroundColor Cyan
        shell: pwsh

      - name: 🔧 Create Virtual Environment
        run: |
          Write-Host "🏗️ Creating virtual environment..." -ForegroundColor Yellow
          python -m venv .venv
          Write-Host "✅ Virtual environment created" -ForegroundColor Green
        shell: pwsh

      - name: 📦 Install Requirements
        run: |
          Write-Host "⚡ Activating virtual environment..." -ForegroundColor Yellow
          .\.venv\Scripts\Activate.ps1
          
          Write-Host "⬆️ Upgrading pip..." -ForegroundColor Yellow
          pip install --upgrade pip
          
          Write-Host "📋 Installing requirements..." -ForegroundColor Yellow
          pip install -r backend/requirements.txt
          
          Write-Host "🔨 Installing PyInstaller..." -ForegroundColor Yellow
          pip install pyinstaller
          
          Write-Host "✅ All dependencies installed" -ForegroundColor Green
        shell: pwsh

      - name: 🔍 Auto-Detect PyInstaller Dependencies
        run: |
          Write-Host "🔍 Auto-detecting PyInstaller dependencies..." -ForegroundColor Yellow
          .\.venv\Scripts\Activate.ps1
          
          # Run the auto-detection script
          python scripts/auto-detect-dependencies.py
          
          Write-Host "📋 Auto-detection complete" -ForegroundColor Green
          if (Test-Path "pyinstaller_command.txt") {
            Write-Host "📄 Generated command:" -ForegroundColor Cyan
            Get-Content "pyinstaller_command.txt"
          }
        shell: pwsh

      - name: 🔨 Build main.exe with Auto-Detected Dependencies
        run: |
          Write-Host "🏗️ Building backend executable with auto-detected dependencies..." -ForegroundColor Yellow
          .\.venv\Scripts\Activate.ps1
          
          Write-Host "📄 Checking if backend/main.py exists..." -ForegroundColor Cyan
          if (Test-Path "backend/main.py") {
            Write-Host "✅ Found backend/main.py" -ForegroundColor Green
          } else {
            Write-Host "❌ backend/main.py not found!" -ForegroundColor Red
            Write-Host "📁 Current directory contents:" -ForegroundColor Yellow
            Get-ChildItem -Name
            Write-Host "📁 Backend directory contents:" -ForegroundColor Yellow
            Get-ChildItem backend -Name
            exit 1
          }
          
          # Use comprehensive approach - include everything we might need
          Write-Host "📄 Building with comprehensive dependency collection..." -ForegroundColor Cyan
          pyinstaller --onedir backend/main.py `
            --hidden-import=scipy._cyutility `
            --hidden-import=scipy.sparse._matrix `
            --hidden-import=scipy.sparse.csgraph._validation `
            --hidden-import=scipy.special._ufuncs_cxx `
            --hidden-import=scipy.linalg.cython_blas `
            --hidden-import=scipy.linalg.cython_lapack `
            --hidden-import=scipy.integrate._quadpack `
            --hidden-import=scipy.integrate._odepack `
            --hidden-import=scipy.integrate._dop `
            --hidden-import=sklearn.utils._cython_blas `
            --hidden-import=sklearn.neighbors.typedefs `
            --hidden-import=sklearn.neighbors.quad_tree `
            --hidden-import=sklearn.tree._utils `
            --hidden-import=transformers.models.auto.modeling_auto `
            --hidden-import=transformers.models.auto.tokenization_auto `
            --hidden-import=paddleocr `
            --hidden-import=paddlex `
            --collect-all=scipy `
            --collect-all=sklearn `
            --collect-all=transformers `
            --collect-all=paddleocr `
            --collect-all=paddlex `
            --collect-all=numpy `
            --collect-all=pandas `
            --collect-all=PIL `
            --collect-all=cv2 `
            --noconfirm `
            --clean
          
          Write-Host "🔍 Checking if main.exe was created..." -ForegroundColor Yellow
          if (Test-Path "dist/main/main.exe") {
            Write-Host "✅ main.exe created successfully!" -ForegroundColor Green
            $fileSize = (Get-Item "dist/main/main.exe").Length / 1MB
            Write-Host "📊 Size: $([math]::Round($fileSize, 2)) MB" -ForegroundColor Cyan
          } else {
            Write-Host "❌ main.exe not found!" -ForegroundColor Red
            exit 1
          }
        shell: pwsh

      - name: ⚙️ Run Post-Build Script
        run: |
          Write-Host "🔧 Running post-build processing..." -ForegroundColor Yellow
          .\.venv\Scripts\Activate.ps1
          python postbuild.py
          
          Write-Host "📋 Checking post-build results..." -ForegroundColor Cyan
          Write-Host "📁 dist/main directory contents:" -ForegroundColor Yellow
          if (Test-Path "dist/main") {
            Get-ChildItem "dist/main" -Name | Select-Object -First 20
          }
          
          Write-Host "✅ Post-build completed" -ForegroundColor Green
        shell: pwsh

      - name: 🚀 Start Backend Server
        run: |
          Write-Host "🖥️ Starting main.exe server..." -ForegroundColor Yellow
          
          # First, let's check what we have in the dist directory
          Write-Host "📁 Checking dist directory contents..." -ForegroundColor Cyan
          if (Test-Path "dist") {
            Get-ChildItem dist -Recurse | Format-Table Name, Length, FullName
          } else {
            Write-Host "❌ dist directory not found!" -ForegroundColor Red
            exit 1
          }
          
          # Check if main.exe exists and is executable
          $mainExe = "dist/main/main.exe"
          if (-not (Test-Path $mainExe)) {
            Write-Host "❌ main.exe not found at $mainExe!" -ForegroundColor Red
            exit 1
          }
          
          $fileInfo = Get-Item $mainExe
          Write-Host "📊 main.exe info:" -ForegroundColor Cyan
          Write-Host "  - Size: $([math]::Round($fileInfo.Length / 1MB, 2)) MB" -ForegroundColor White
          Write-Host "  - Created: $($fileInfo.CreationTime)" -ForegroundColor White
          
          # Create logs directory
          New-Item -ItemType Directory -Path "logs" -Force | Out-Null
          
          # Set environment variables that main.exe might need
          Write-Host "🔧 Setting up environment variables..." -ForegroundColor Cyan
          $env:API_HOST = "127.0.0.1"
          $env:API_PORT = "7500"
          $env:PYTHONIOENCODING = "utf-8"
          
          # Try to run main.exe and capture output
          Write-Host "🚀 Starting main.exe with output capture..." -ForegroundColor Yellow
          
          try {
            # Start process with output redirection and environment
            $process = Start-Process -FilePath $mainExe -PassThru -WindowStyle Hidden -RedirectStandardOutput "logs/stdout.log" -RedirectStandardError "logs/stderr.log"
            Write-Host "🆔 Process ID: $($process.Id)" -ForegroundColor Cyan
            
            # Wait a bit for startup
            Write-Host "⏳ Waiting for server to start..." -ForegroundColor Yellow
            Start-Sleep -Seconds 10
            
            # Check if process is still running
            $isRunning = Get-Process -Id $process.Id -ErrorAction SilentlyContinue
            if ($isRunning) {
              Write-Host "✅ Backend server is running!" -ForegroundColor Green
              echo "BACKEND_PID=$($process.Id)" >> $env:GITHUB_ENV
            } else {
              Write-Host "❌ Backend server failed to start!" -ForegroundColor Red
              
              # Show exit code if available
              if ($process.HasExited) {
                Write-Host "💥 Exit code: $($process.ExitCode)" -ForegroundColor Red
              }
              
              # Display captured logs
              Write-Host "📄 Standard Output:" -ForegroundColor Yellow
              if (Test-Path "logs/stdout.log") {
                Get-Content "logs/stdout.log" | Write-Host
              } else {
                Write-Host "  (No stdout log found)" -ForegroundColor Gray
              }
              
              Write-Host "📄 Standard Error:" -ForegroundColor Yellow
              if (Test-Path "logs/stderr.log") {
                Get-Content "logs/stderr.log" | Write-Host
              } else {
                Write-Host "  (No stderr log found)" -ForegroundColor Gray
              }
              
              # Try running main.exe directly to see immediate errors
              Write-Host "🔍 Trying direct execution to see errors..." -ForegroundColor Yellow
              try {
                & $mainExe --help 2>&1 | Write-Host
              } catch {
                Write-Host "❌ Direct execution failed: $_" -ForegroundColor Red
              }
              
              exit 1
            }
          } catch {
            Write-Host "❌ Failed to start process: $_" -ForegroundColor Red
            exit 1
          }
        shell: pwsh

      - name: 🩺 Test Backend Health
        run: |
          Write-Host "🔍 Testing backend health..." -ForegroundColor Yellow
          
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:7500/" -TimeoutSec 10
            Write-Host "✅ Server responded with status: $($response.StatusCode)" -ForegroundColor Green
            Write-Host "📄 Response: $($response.Content)" -ForegroundColor Cyan
          } catch {
            Write-Host "❌ Health check failed: $_" -ForegroundColor Red
            
            Write-Host "📡 Checking what's on port 7500..." -ForegroundColor Yellow
            netstat -an | findstr :7500
            
            exit 1
          }
        shell: pwsh

      - name: 🧹 Cleanup
        if: always()
        run: |
          Write-Host "🧹 Cleaning up..." -ForegroundColor Yellow
          
          if ($env:BACKEND_PID) {
            try {
              Stop-Process -Id $env:BACKEND_PID -Force -ErrorAction SilentlyContinue
              Write-Host "✅ Backend process stopped" -ForegroundColor Green
            } catch {
              Write-Host "⚠️ Process may have already stopped" -ForegroundColor Yellow
            }
          }
        shell: pwsh

      - name: 📊 Collect Debug Information
        if: failure()
        run: |
          Write-Host "🚨 Build failed - collecting debug information..." -ForegroundColor Red
          Write-Host "=================================" -ForegroundColor Red
          
          Write-Host "🖥️ System Information:" -ForegroundColor Yellow
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory
          
          Write-Host "🐍 Python Information:" -ForegroundColor Yellow
          python --version 2>&1 || Write-Host "Python not found"
          where python 2>&1 || Write-Host "Python path not found"
          
          Write-Host "📁 Virtual Environment:" -ForegroundColor Yellow
          if (Test-Path ".venv") {
            Write-Host "✅ .venv directory exists" -ForegroundColor Green
            Get-ChildItem .venv -Name
          } else {
            Write-Host "❌ .venv directory missing" -ForegroundColor Red
          }
          
          Write-Host "🔍 Build Artifacts:" -ForegroundColor Yellow
          if (Test-Path "dist") {
            Write-Host "📁 dist directory contents:" -ForegroundColor Cyan
            Get-ChildItem dist -Recurse -Name | Select-Object -First 20
          } else {
            Write-Host "❌ dist directory missing" -ForegroundColor Red
          }
          
          Write-Host "📡 Port Information:" -ForegroundColor Yellow
          netstat -an | findstr :7500 || Write-Host "No process on port 7500"
          
          Write-Host "🔐 Environment Configuration:" -ForegroundColor Yellow
          if (Test-Path "frontend/.env") {
            Write-Host "✅ .env file exists" -ForegroundColor Green
          } else {
            Write-Host "❌ .env file missing" -ForegroundColor Red
          }
          
          Write-Host "=================================" -ForegroundColor Red
        shell: pwsh

      - name: 📤 Upload Debug Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-${{ github.run_number }}
          path: |
            **/*.log
            logs/
            dist/
            frontend/.env
          retention-days: 7

      - name: 💾 Save Working PyInstaller Configuration
        if: success()
        run: |
          Write-Host "💾 Saving working PyInstaller configuration..." -ForegroundColor Yellow
          
          $workingConfig = @"
          # ✅ WORKING PyInstaller Configuration (Generated on $(Get-Date))
          # This configuration successfully built and ran main.exe in GitHub Actions
          
          pyinstaller --onedir backend/main.py \
            --hidden-import=scipy._cyutility \
            --hidden-import=scipy.sparse._matrix \
            --hidden-import=scipy.sparse.csgraph._validation \
            --hidden-import=scipy.special._ufuncs_cxx \
            --hidden-import=scipy.linalg.cython_blas \
            --hidden-import=scipy.linalg.cython_lapack \
            --hidden-import=scipy.integrate._quadpack \
            --hidden-import=scipy.integrate._odepack \
            --hidden-import=scipy.integrate._dop \
            --hidden-import=sklearn.utils._cython_blas \
            --hidden-import=sklearn.neighbors.typedefs \
            --hidden-import=sklearn.neighbors.quad_tree \
            --hidden-import=sklearn.tree._utils \
            --hidden-import=transformers.models.auto.modeling_auto \
            --hidden-import=transformers.models.auto.tokenization_auto \
            --hidden-import=paddleocr \
            --hidden-import=paddlex \
            --collect-all=scipy \
            --collect-all=sklearn \
            --collect-all=transformers \
            --collect-all=paddleocr \
            --collect-all=paddlex \
            --collect-all=numpy \
            --collect-all=pandas \
            --collect-all=PIL \
            --collect-all=cv2 \
            --noconfirm \
            --clean
          "@
          
          $workingConfig | Out-File -FilePath "WORKING_PYINSTALLER_CONFIG.txt" -Encoding UTF8
          Write-Host "✅ Working configuration saved to WORKING_PYINSTALLER_CONFIG.txt" -ForegroundColor Green
        shell: pwsh

      - name: 📤 Upload Working Configuration
        if: success()  
        uses: actions/upload-artifact@v4
        with:
          name: working-pyinstaller-config-${{ github.run_number }}
          path: |
            WORKING_PYINSTALLER_CONFIG.txt
            pyinstaller_command.txt
          retention-days: 30

      - name: 📊 Build Summary
        if: success()
        run: |
          Write-Host "🎉 Backend Build & Test Complete!" -ForegroundColor Green
          Write-Host "=================================" -ForegroundColor Cyan
          Write-Host "✅ Virtual environment created" -ForegroundColor Green
          Write-Host "✅ Dependencies installed" -ForegroundColor Green
          Write-Host "✅ main.exe built successfully" -ForegroundColor Green
          Write-Host "✅ Post-build processing completed" -ForegroundColor Green
          Write-Host "✅ Backend server started" -ForegroundColor Green
          Write-Host "✅ Health check passed" -ForegroundColor Green
          Write-Host "✅ Working PyInstaller config saved" -ForegroundColor Green
          Write-Host "=================================" -ForegroundColor Cyan
          Write-Host "💾 Download working config from artifacts!" -ForegroundColor Blue
          Write-Host "🔗 Next: Check https://github.com/${{ github.repository }}/actions for details" -ForegroundColor Blue
        shell: pwsh